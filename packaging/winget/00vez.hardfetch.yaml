ShortDescription: Compact system info tool, neofetch style, in C
Description: |-
  hardfetch prints the operating system, board, uptime, CPU, RAM, GPU,
  disk, network and display information in a compact block, in the spirit
  of neofetch.

  It is a single statically linked executable of about 214 KB that needs no
  configuration and starts in roughly 28 milliseconds, where neofetch and
  fastfetch need considerably longer.

  Flags: -a adds build, kernel, shell, terminal, iGPU, display, every
  interface and the public IP. -l refreshes in place. -d prints per module
  timings and the data source that was used.
