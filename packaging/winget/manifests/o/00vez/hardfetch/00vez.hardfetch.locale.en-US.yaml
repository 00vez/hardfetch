ShortDescription: Compact system info tool, neofetch style, in C
Description: |-
  hardfetch prints operating system, board, uptime, CPU, RAM, GPU, disk,
  network and display information in a compact block, in the spirit of
  neofetch. A single statically linked executable of about 214 KB that needs
  no configuration and starts in roughly 28 milliseconds.
